#
# Promptfall ships a static site built from an npm toolchain, so the dependency
# tree and the Actions workflows ARE the supply chain — keep both patched.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
